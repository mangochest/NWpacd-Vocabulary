{% extends "base.html" %}
{% block content %}
<style>
    .welcome-box {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%;
        min-height: 440px;
    }
    .brand-title {
        /* ĐÃ SỬA: Ép font chữ Didot cho tiêu đề chính */
        font-family: 'Didot', 'Bodoni MT', 'Cinzel', serif;
        font-style: italic;
        font-size: 4.5rem;
        font-weight: 500;
        margin-bottom: 15px;
    }
    /* "Welcome to" màu xanh tím nhẹ nhàng */
    .brand-title span:nth-child(1) { 
        color: #5369b2; 
        font-family: 'Didot', serif; 
        font-size: 4.2rem; 
    } 
    /* "NW" màu hồng đậm cá tính */
    .brand-title span:nth-child(2) { 
        color: #ff6ca1; 
        font-weight: bold; 
    } 
    /* "pacd" màu vàng pastel ngọt ngào */
    .brand-title span:nth-child(3) { 
        color: #f9b863; 
    } 
    
    .brand-sub {
        /* ĐÃ SỬA: Đồng bộ font Didot cho dòng mô tả lãng mạn */
        font-family: 'Didot', 'Bodoni MT', serif;
        font-style: italic;
        color: #3b4e85;
        font-size: 2.2rem;
        margin: 0;
    }
</style>

<div class="main-card">
    <div class="welcome-box text-center">
        <h1 class="brand-title">
            <span>Welcome to </span><span>NW</span><span>pacd</span>
        </h1>
        <p class="brand-sub">~Website học từ vựng đa ngôn ngữ~</p>
    </div>
</div>
{% endblock %}
