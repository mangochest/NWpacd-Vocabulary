{% extends "base.html" %}
{% block content %}
<div class="main-card mx-auto" style="max-width: 750px;">
    <h2 class="mb-4 fst-italic" style="color: #ff6ca1; font-family: 'Georgia', serif;">Thêm từ vựng mới</h2>
    <form method="POST">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold" style="color: #3b4e85;">Từ vựng</label>
                <input type="text" name="word" class="form-control rounded-pill border-secondary-subtle px-3" style="background-color: #ffffff;" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold" style="color: #3b4e85;">Phiên âm</label>
                <input type="text" name="pronunciation" class="form-control rounded-pill border-secondary-subtle px-3" style="background-color: #ffffff;" placeholder="Ví dụ: /həˈləʊ/">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold" style="color: #3b4e85;">Loại từ</label>
                <select name="word_type" class="form-select rounded-pill border-secondary-subtle px-3" style="background-color: #ffffff;">
                    <option value="Danh từ">Danh từ (n)</option>
                    <option value="Động từ">Động từ (v)</option>
                    <option value="Tính từ">Tính từ (adj)</option>
                    <option value="Trạng từ">Trạng từ (adv)</option>
                    <option value="Giới từ">Giới từ (prep)</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold" style="color: #3b4e85;">Ngôn ngữ (Tên bảng)</label>
                <input type="text" name="language" class="form-control rounded-pill border-secondary-subtle px-3" style="background-color: #ffffff;" placeholder="Ví dụ: Tiếng Anh" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold" style="color: #3b4e85;">Ý nghĩa</label>
            <input type="text" name="meaning" class="form-control rounded-pill border-secondary-subtle px-3" style="background-color: #ffffff;" required>
        </div>

        <div class="card p-3 mb-4 border-0 shadow-sm rounded-4" style="background-color: #fffdec;">
            <span class="fw-bold mb-2" style="color: #ff6ca1;"><i class="bi bi-bookmark-star-fill"></i> Cột ví dụ minh họa</span>
            <div class="row">
                <div class="col-md-6 mb-2">
                    <label class="form-label text-muted small fw-bold">Ngoại ngữ</label>
                    <textarea name="example_foreign" class="form-control rounded-3 border-secondary-subtle" rows="2" style="background-color: #ffffff;" placeholder="Nhập câu ví dụ mẫu..."></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-muted small fw-bold">Tiếng Việt (Dịch nghĩa)</label>
                    <textarea name="example_vietnamese" class="form-control rounded-3 border-secondary-subtle" rows="2" style="background-color: #ffffff;" placeholder="Nhập bản dịch nghĩa câu ví dụ..."></textarea>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between">
            <a href="/word" class="btn btn-cute btn-outline-secondary px-4">Quay lại</a>
            <button type="submit" class="btn btn-cute text-white px-4" style="background-color: #79d279;">Lưu từ mới</button>
        </div>
    </form>
</div>
{% endblock %}
