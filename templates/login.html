{% extends "base.html" %}
{% block content %}
<div class="main-card mx-auto" style="max-width: 500px; min-height: auto;">
    <h2 class="text-center mb-4 fst-italic" style="color: #ff6ca1; font-family: 'Georgia', serif;">Đăng nhập</h2>
    <form method="POST" action="/login">
        <div class="mb-3">
            <label class="form-label fw-bold" style="color: #3b4e85;">Email</label>
            <input type="email" name="email" class="form-control rounded-pill border-secondary-subtle px-3" style="background-color: #fffdec;" required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-bold" style="color: #3b4e85;">Mật khẩu</label>
            <input type="password" name="password" class="form-control rounded-pill border-secondary-subtle px-3" style="background-color: #fffdec;" required>
        </div>
        <button type="submit" class="btn btn-cute w-100 text-white fs-5" style="background-color: #5369b2;">
            Đăng nhập
        </button>
    </form>
</div>
{% endblock %}
